[package]
name = "ui"
version = "0.1.0"
edition = "2024"

[features]
default=["real"]
usbmon=["dep:pcap"]
real=[]


[dependencies]
presonus_revalator = { path = "../.." }

eframe = "0.33"
nusb = "0.2.5"
pcap = { version = "2.4.0", optional = true }

#egui-audio = { git = "https://github.com/Cannedfood/egui-audio", branch = "main" }
armas = "0.2.2"
armas-audio = "0.2.2"


env_logger = {version = "0.11.11", features = ["auto-color", "humantime"] }
binrw = "0.15.1"



