[package]
name = "ui"
version = "0.1.0"
edition = "2024"

[features]
default=["real"]
usbmon=["dep:pcap"]
real=[]


[dependencies]
presonus_revalator = { path = "../.." }
egui-audio-controls = { path = "../audio-controls" }

eframe = "0.36.1"
nusb = "0.2.7"
pcap = { version = "2.5.0", optional = true }

env_logger = {version = "0.11.11", features = ["auto-color", "humantime"] }
binrw = "0.15.2"
enum-map = "3.1.0"
anyhow = "1.0.104"
paste = "1.0.15"



